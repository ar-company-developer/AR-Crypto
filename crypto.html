<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Crypto Dashboard</title>
    <style>
        :root {
            --bg-dark: #0a111e;
            --bg-gradient: radial-gradient(circle at top, #1c2c4d 0%, #0a111e 100%);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-secondary: #848e9c;
            --accent-green: #00ff88;
            --accent-red: #ff4d4d;
            --btc-color: #f7931a;
            --eth-color: #627eea;
            --ton-color: #0088cc;
            --usdt-color: #26a17b;
            --ar-color: #ffffff;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex; 
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .profile-icon {
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        
        .validators-info {
            display: flex;
            align-items: center;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .avatar-stack {
            display: flex;
            margin-right: 8px;
        }

        .avatar-mini {
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 2px solid #0d1626;
            margin-right: -8px;
            background: #2a3547;
        }

        .balance-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .balance-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 5px;
        }
#active-list {
    display: none;
    flex-direction: column; 
    gap: 1px; 
    width: 100%;
}
        .balance-amount {
            font-size: 46px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .balance-amount span {
            color: white;
            font-size: 34px;
        }


.asset-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.asset-col-right {
    text-align: right;
    align-items: flex-end;
}
.tab-content {
    display: none;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
}
.tab-content.active-content {
    display: flex;
    opacity: 1;
    transform: translateY(0);
}
        .balance-change {
            font-size: 14px;
            color: var(--accent-green);
            margin-top: 5px;
            font-weight: 500;
        }
#history-list {
    width: 100%;
    max-width: 450px;
    display: none; 
    flex-direction: column;
    gap: 10px;
}

.history-item {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-left { display: flex; align-items: center; gap: 12px; }

.history-icon {
    width: 35px; height: 35px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 12px;
}
.active-asset-row {
    display: flex; /* Тільки flex для вирівнювання ліво/право */
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 4px solid var(--accent-green);
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 12px; /* Відступ між картками */
    width: 100%;
    box-sizing: border-box;
}


    .asset-info, .asset-value {
        display: flex;
        flex-direction: column;
        gap: 4px; 
    }

    .asset-value { text-align: right; }
    
    .asset-label {
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
    }

    .asset-main-text {
        font-weight: 600;
        font-size: 17px;
        color: white;
    }
.type-buy { background: rgba(0, 255, 136, 0.1); color: var(--accent-green); }
.type-sell { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); }

.history-details { display: flex; flex-direction: column; }
.history-coin { font-weight: 600; font-size: 15px; }
.history-date { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

.history-right { text-align: right; }
.history-amount { font-weight: 700; font-size: 14px; display: block; }
.history-price { font-size: 11px; color: var(--text-secondary); }
.tabs-nav {
    position: relative; 
    background: rgba(255, 255, 255, 0.05);
    border-radius: 14px;
    display: flex;
    padding: 4px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 20px;
    z-index: 1;
}

.tab-item {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 10px;
    position: relative;
    z-index: 2; /* Щоб текст був над повзунком */
    transition: color 0.3s ease;
}

.tab-item.active {
    color: white;
    background: transparent;
}


.tab-slider {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc(33.33% - 4px);
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* М'яка анімація */
    z-index: 0;
}

        .crypto-list {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .crypto-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
        }

        .crypto-row:active { transform: scale(0.98); }

        .crypto-row::before {
            content: "";
            position: absolute;
            left: 0; top: 20%; bottom: 20%; width: 3px;
            border-radius: 0 4px 4px 0;
        }
/* Початковий стан контенту (прихований) */
.tab-content {
    display: none;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    width: 100%;
    max-width: 450px;
}

/* Стан, коли вкладка активна */
.tab-content.active-content {
    display: flex;
    opacity: 1;
    transform: translateY(0);
}

/* Додамо плавності самій кнопці таба */
.tab-item {
    transition: background 0.2s ease, color 0.2s ease;
}

        .btc-row::before { background: var(--btc-color); box-shadow: 0 0 10px var(--btc-color); }
        .eth-row::before { background: var(--eth-color); box-shadow: 0 0 10px var(--eth-color); }
        .ton-row::before { background: var(--ton-color); box-shadow: 0 0 10px var(--ton-color); }
        .usdt-row::before { background: var(--usdt-color); box-shadow: 0 0 10px var(--usdt-color); }
        .ar-row::before { background: var(--ar-color); box-shadow: 0 0 10px var(--ar-color); }

        .crypto-info { display: flex; align-items: center; gap: 15px; }
        .crypto-icon-box { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .crypto-names { display: flex; flex-direction: column; }
        .crypto-symbol { font-weight: 600; font-size: 17px; }
        .crypto-full-name { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; }

        .status-badge {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 800;
            text-align: center;
        }
        /* Прибираємо синє виділення при натисканні на мобільних пристроях */
.tab-item, .crypto-row, .history-item, a, button {
    -webkit-tap-highlight-color: transparent;
    outline: none;
}

/* Додатково прибираємо контур при фокусі (для десктопів) */
.tab-item:focus {
    outline: none;
}

        .status-badge.on { background: rgba(0, 255, 136, 0.1); color: var(--accent-green); }
        .trend-up { color: var(--accent-green); }
        .trend-down { color: var(--accent-red); }

        .price-text {
            font-size: 15px;
            font-weight: 600;
            margin-top: 4px;
            display: block;
        }

        .cap-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }
    </style>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCxfUZl7STcdC53SSogfbVc-4dIijVEbLg",
        authDomain: "ar-bank-dbfd9.firebaseapp.com",
        databaseURL: "https://ar-bank-dbfd9-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ar-bank-dbfd9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const tabs = document.querySelectorAll('.tab-item');
    const cryptoList = document.querySelector('.crypto-list');
    const historyList = document.getElementById('history-list');
    const activeList = document.getElementById('active-list');

    // Налаштування цін (Оригінальні seeds та bases)
    let coinMultipliers = {};
    const bases = { 'Bitcoin': 92000, 'Ethereum': 3700, 'Toncoin': 5.20, 'ARcoin': 12.50, 'Solana': 105.00, 'Tether': 1.00 };
    const coinSeeds = { 'Bitcoin': 123.45, 'Ethereum': 678.90, 'Toncoin': 432.10, 'ARcoin': 999.99, 'Solana': 555.55 };

    // --- ОРИГІНАЛЬНА ФУНКЦІЯ ЦІНИ ---
    function getLiveMarketData(coinName) {
        if (coinName === 'Tether' || coinName === 'USDT') return { price: 1.00, percent: "0.00", isUp: true };
        
        const multiplier = coinMultipliers[coinName] || 1;
        const base = (bases[coinName] || 100) * multiplier;
        const seed = coinSeeds[coinName] || 1.0;
        
        const now = Math.floor(Date.now() / 10000) * 10000;
        const t = Math.floor(now / 10000); 

        const calc = (step) => {
            const s = step + (seed * 500); 
            const wave1 = Math.sin(s * 0.02) * (base * 0.04);
            const wave2 = Math.sin(s * 0.15) * (base * 0.01);
            const noise = Math.sin(Math.tan(Math.sin(s * 0.5))) * (base * 0.005);
            const trend = Math.cos(s * 0.011 + Math.sin(s * 0.002)) * (base * 0.06);
            return base + wave1 + wave2 + noise + trend;
        };

        const current = calc(t);
        const previous = calc(t - 1);
        return {
            price: current.toFixed(2),
            percent: Math.abs(((current - previous) / previous) * 100).toFixed(2),
            isUp: current >= previous
        };
    }

    // --- ПЕРЕМИКАННЯ ТАБІВ ---
    // Знаходимо повзунок
const slider = document.querySelector('.tab-slider');

// Оновлений блок із додаванням index
tabs.forEach((tab, index) => {
    tab.addEventListener('click', () => {
        const tabName = tab.textContent.trim();
        if (tab.classList.contains('active')) return;

        // 1. Рухаємо повзунок плавно (0% для першого, 100% для другого, 200% для третього)
        if (slider) {
            slider.style.transform = `translateX(${index * 100}%)`;
        }

        // 2. Оновлюємо активний клас для кнопок
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        // 3. Твоя стандартна логіка анімації контенту
        [cryptoList, historyList, activeList].forEach(el => {
            if(el) el.classList.remove('active-content');
        });

        setTimeout(() => {
            cryptoList.style.display = 'none';
            historyList.style.display = 'none';
            if(activeList) activeList.style.display = 'none';

            let target;
            if (tabName === 'Coins') target = cryptoList;
            else if (tabName === 'History') target = historyList;
            else if (tabName === 'My Active') target = activeList;
            
            if(target) {
                target.style.display = 'flex';
                setTimeout(() => target.classList.add('active-content'), 20);
            }
        }, 150);
    });
});
    function loadActiveAssets(uid) {
        onValue(ref(db, `crypto/user/${uid}/user-coin`), (snapshot) => {
            if (!snapshot.exists()) {
                activeList.innerHTML = '<div style="text-align:center; padding:40px; color:gray;">Немає активів</div>';
                return;
            }

            let html = "";
            const coins = snapshot.val();
            let hasAssets = false;

            for (const [name, qty] of Object.entries(coins)) {
                if (Number(qty) > 0) {
                    hasAssets = true;
                    const market = getLiveMarketData(name);
                    const totalValue = (Number(qty) * Number(market.price)).toFixed(2);
                    html += `
                    <div class="active-asset-row">
                        <div class="asset-info">
                            <span class="asset-main-text">${name}</span>
                            <span class="asset-label">К-сть: ${Number(qty).toFixed(4)}</span>
                        </div>
                        <div class="asset-value">
                            <span class="asset-main-text">$${Number(totalValue).toLocaleString()}</span> 
                            <span class="asset-label">Equity</span>
                        </div> 
                    </div> `;
                }
            }
            activeList.innerHTML = hasAssets ? html : '<div style="text-align:center; padding:40px; color:gray;">Баланси порожні</div>';
        });
    }
    function loadUserHistory(uid) {
        onValue(query(ref(db, `crypto/user/${uid}/history`), limitToLast(20)), (snapshot) => {
            if (!snapshot.exists()) {
                historyList.innerHTML = '<div style="text-align:center; padding:40px; color:gray;">Історія порожня</div>';
                return;
            }
            let html = "";
            const data = [];
            snapshot.forEach(child => { data.push(child.val()); });
            data.reverse().forEach(item => {
                const isBuy = item.type === 'buy';
                html += `
                <div class="history-item">
                    <div class="history-left">
                        <div class="history-icon ${isBuy ? 'type-buy' : 'type-sell'}">${isBuy ? 'IN' : 'OUT'}</div>
                        <div class="history-details">
                            <span class="history-coin">${item.coin || 'Crypto'}</span>
                            <span class="history-date">${new Date(item.timestamp).toLocaleString('uk-UA', {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                    </div>
                    <div class="history-right">
                        <span class="history-amount" style="color:${isBuy ? 'var(--accent-green)' : 'var(--accent-red)'}">
                            ${isBuy ? '+' : '-'}${item.amount}
                        </span>
                    </div>
                </div>`;
            });
            historyList.innerHTML = html;
        });
    }
    function refreshMarketUI() {
        const ids = { 'Bitcoin': 'btc', 'Ethereum': 'eth', 'Toncoin': 'ton', 'ARcoin': 'ar', 'Tether': 'usdt' };
        for (const [name, id] of Object.entries(ids)) {
            const data = getLiveMarketData(name);
            const pEl = document.getElementById(`${id}-price`);
            const tEl = document.getElementById(`${id}-trend`);
            
            if (pEl) pEl.textContent = `$${Number(data.price).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            if (tEl && name !== 'Tether') {
                tEl.textContent = `${data.isUp ? '▲' : '▼'} ${data.percent}%`;
                tEl.className = `status-badge ${data.isUp ? 'trend-up' : 'trend-down'}`;
            }
        }
    }

    onValue(ref(db, `crypto/settings/multipliers`), s => { 
        coinMultipliers = s.val() || {}; 
        refreshMarketUI(); 
    });

    onAuthStateChanged(auth, user => {
        if (user) {
            onValue(ref(db, `crypto/user/${user.uid}/balance`), s => {
                const b = Number(s.val() || 0).toFixed(2).split('.');
                document.getElementById('bal-int').textContent = Number(b[0]).toLocaleString();
                document.getElementById('bal-dec').textContent = '.' + b[1];
            });
            loadUserHistory(user.uid);
            loadActiveAssets(user.uid);
            setInterval(refreshMarketUI, 5000);
            refreshMarketUI();
        } else {
            window.location.href = "login.html";
        }
    });
</script>

</body>
</html>
