<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Welcome | AR Crypto</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --accent-orange: #dc8109;
      --accent-green: #09dc13;
      --accent-blue: #2196f3;
      --text-main: #ffffff;
      --text-secondary: #94a3b8;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070b14 100%);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .top-content {
      width: 100%;
      max-width: 380px;
      padding: 40px 24px 0 24px;
      box-sizing: border-box;
      text-align: center;
      flex-grow: 1;
    }

    .header-section h2 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin: 0 0 8px 0;
      background: linear-gradient(to bottom, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-section p {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 35px;
    }

    /* Картки */
    .feature-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 18px 20px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      animation: cardAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Почергова затримка для 4 карток */
    .feature-card:nth-child(2) { animation-delay: 0.1s; }
    .feature-card:nth-child(3) { animation-delay: 0.2s; }
    .feature-card:nth-child(4) { animation-delay: 0.3s; }
    .feature-card:nth-child(5) { animation-delay: 0.4s; }

    @keyframes cardAppear {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-box {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-text h4 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .card-text p {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Кнопки */
    .bottom-actions {
      width: 100%;
      max-width: 400px;
      padding: 20px 24px 40px 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(to top, var(--bg-dark) 80%, transparent);
      opacity: 0;
      animation: fadeIn 0.8s ease 0.6s forwards;
    }

    button {
      height: 58px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
    }

    .btn-create {
      background: rgba(255, 255, 255, 0.06);
      color: white;
      border: 1px solid var(--glass-border);
    }

    .btn-login {
      background: var(--accent-orange);
      color: white;
      box-shadow: 0 10px 25px rgba(220, 129, 9, 0.3);
    }

    button:active { transform: scale(0.96); }

    @keyframes fadeIn { to { opacity: 1; } }

  </style>
</head>
<body>

  <div class="top-content">
    <div class="header-section">
      <h2 style="opacity:0; animation: fadeIn 0.8s ease forwards;">AR Crypto</h2>
      <p style="opacity:0; animation: fadeIn 0.8s ease 0.2s forwards;">Your gateway to the future</p>
    </div>

    <div class="feature-card">
      <div class="icon-box">
        <svg fill="var(--accent-orange)" width="30" height="30" viewBox="0 0 256 238">
          <path d="M122.7,109.9l0.1-30.1c8.5,0,35.2-2.6,35.2,15.2C157.9,112,131.2,109.9,122.7,109.9z M164.8,141.8L164.8,141.8 c0.1-19.5-32-16.7-42.2-16.7l-0.1,33.2C132.7,158.3,164.8,160.5,164.8,141.8z M10.6,119.9C10.6,54.9,62.8,2,127.8,2 c65,0,117.5,52.5,117.5,117.5c0,65-52.9,117.5-117.5,117.5S10.6,184.6,10.6,119.9z M98.1,113.5c-0.5,0-1,0-1.6,0L96.3,153 c-0.3,1.9-1.4,5-5.7,5c0.2,0.2-11,0-11,0l-3.1,18l19.6,0.1c3.7,0,7.2,0.1,10.8,0.1l-0.1,25l15.1,0.1l0.1-24.8 c4.1,0.1,8.1,0.1,12,0.2l-0.1,24.7l15.1,0.1l0.1-25c25.3-1.4,43.1-7.7,45.4-31.5c1.8-19.2-7.1-27.7-21.5-31.2 c8.8-4.4,14.2-12.2,13-25.3h0c-1.7-17.9-17-23.9-36.5-25.7l0.1-24.8l-15.1-0.1L134.5,62c-4,0-8,0.1-12,0.1l0.1-24.3l-15.1-0.1 l-0.1,24.8c-3.3,0.1-6.5,0.1-9.6,0.1l0-0.1l-20.8-0.1L77,78.5c0,0,11.1-0.2,10.9,0c6.1,0,8.1,3.6,8.6,6.6l-0.1,28.2 C96.9,113.4,97.5,113.4,98.1,113.5z"/>
        </svg>
      </div>
      <div class="card-text">
        <h4>Local Exchange</h4>
        <p>First Crypto Market in Emergency Hamburg</p>
      </div>
    </div>

    <div class="feature-card">
      <div class="icon-box">
        <svg width="28" height="28" viewBox="0 0 512 512">
          <path fill="var(--accent-green)" d="M424.25,241.672v206.094h79.5V158.953C480.391,188.781,453.719,216.469,424.25,241.672z M320.313,313.5v134.266h79.375V261.547C374.875,280.609,348.344,297.984,320.313,313.5z M216.438,359.719v88.047h79.125V326.5C270.234,339.109,243.813,350.219,216.438,359.719z"/>
          <path fill="var(--accent-green)" d="M413.078,57.688l27.656,23.172C352.953,190.391,185.391,329.125,0,349.766v22.141 c183.875-6.5,381.109-132.453,483.547-255.172L512,140.563V26.969L413.078,57.688z"/>
        </svg>
      </div>
      <div class="card-text">
        <h4>High Profits</h4>
        <p>Maximize your potential trading income</p>
      </div>
    </div>

    <div class="feature-card">
      <div class="icon-box">
        <svg width="26" height="26" fill="var(--accent-blue)" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
      </div>
      <div class="card-text">
        <h4>Secure Wallet</h4>
        <p>Enterprise-grade security for your assets</p>
      </div>
    </div>

    <div class="feature-card">
      <div class="icon-box">
        <svg width="26" height="26" fill="#fff" viewBox="0 0 24 24">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12zM7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/>
        </svg>
      </div>
      <div class="card-text">
        <h4>24/7 Support</h4>
        <p>We are always here to help you trade</p>
      </div>
    </div>

  </div>

  <div class="bottom-actions">
    <button class="btn-create" onclick="window.location.href='signup.html'">+ Create Account</button>
    <button class="btn-login" onclick="window.location.href='login.html'">Already have an account</button>
  </div>

</body>
</html>
