<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | AR Crypto</title>
    <style>
        :root {
            --bg-dark: #070b14;
            --accent-orange: #dc8109;
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --error-red: #ff4d4d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #070b14 100%);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 360px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            animation: containerAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes containerAppear {
            to { opacity: 1; transform: scale(1); }
        }

        .header-section {
            margin-bottom: 40px;
        }

        .header-section h2 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-section p {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input {
            width: 100%;
            height: 56px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 0 20px;
            box-sizing: border-box;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--accent-orange);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 15px rgba(220, 129, 9, 0.1);
        }

        #error-message {
            background: rgba(255, 77, 77, 0.1);
            color: var(--error-red);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .login-btn {
            width: 100%;
            height: 60px;
            background: var(--accent-orange);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(220, 129, 9, 0.25);
            transition: all 0.3s;
        }

        .login-btn:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        .footer-link {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .footer-link a {
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header-section">
            <h2>Sign In</h2>
            <p>Welcome back to AR Crypto</p>
        </div>

        <div id="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email or Username</label>
                <input type="text" id="login-input" placeholder="Enter your email or @username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Login to Account</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
        import { getDatabase, ref, query, orderByChild, equalTo, get, child } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxfUZl7STcdC53SSogfbVc-4dIijVEbLg",
            authDomain: "ar-bank-dbfd9.firebaseapp.com",
            databaseURL: "https://ar-bank-dbfd9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ar-bank-dbfd9",
            storageBucket: "ar-bank-dbfd9.firebasestorage.app",
            messagingSenderId: "635449421773",
            appId: "1:635449421773:web:bc7261cc5a4238c3649e84",
            measurementId: "G-R2B0H618QQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const loginInput = document.getElementById('login-input');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('error-message');

            form.addEventListener('submit', async function(event) {
                event.preventDefault(); 
                errorMessage.style.display = 'none';
                errorMessage.textContent = '';

                const loginValue = loginInput.value.trim();
                const passwordValue = passwordInput.value.trim();

                let email = loginValue;
                if (!loginValue.includes('@')) {
                    email = await resolveUsernameToEmail(loginValue);
                }

                if (!email) {
                    errorMessage.textContent = "Invalid email or password.";
                    errorMessage.style.display = 'block';
                    return;
                }

                handleLogin(email, passwordValue);
            });

            async function resolveUsernameToEmail(username) {
                const cleanUsername = username.startsWith('@') ? username : `@${username}`;
                try {
                    const userQuery = query(ref(database, 'NewUser'), orderByChild('username'), equalTo(cleanUsername));
                    const snapshot = await get(userQuery);
                    if (snapshot.exists()) {
                        const userData = Object.values(snapshot.val())[0]; 
                        return userData.email;
                    } else {
                        return null;
                    }
                } catch (error) {
                    console.error("Username lookup error:", error);
                    return null;
                }
            }

            async function handleLogin(email, password) {
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const uid = userCredential.user.uid;
                    const hasCard = await checkUserCardStatus(uid); 
                    
                    if (hasCard) {
                        sessionStorage.setItem('current_user_uid', uid); 
                        window.location.href = 'pin.html';
                    } else {
                        await auth.signOut(); 
                        errorMessage.textContent = "Error";
                        errorMessage.style.display = 'block';
                    }
                } catch (error) {
                    console.error("Login error:", error.code);
                    errorMessage.textContent = "Invalid email or password.";
                    errorMessage.style.display = 'block';
                }
            }

            async function checkUserCardStatus(uid) {
                try {
                    const dbRef = ref(database);
                    const snapshot = await get(child(dbRef, `user/${uid}`));
                    return snapshot.exists() && snapshot.val().card; 
                } catch (error) {
                    console.error("Database error:", error);
                    return false;
                }
            }
        });
    </script>
</body>
</html>
