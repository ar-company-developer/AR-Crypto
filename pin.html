<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>PIN|ARCrypto</title><style>:root{--bg-dark:#070b14;--accent-orange:#dc8109;--text-main:#ffffff;--text-secondary:#94a3b8;--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.08);--error-red:#ff4d4d}body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:radial-gradient(circle at 50% 0%,#1e293b 0%,#070b14 100%);color:var(--text-main);margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;-webkit-tap-highlight-color:transparent}.pin-container{width:100%;max-width:320px;padding:20px;text-align:center;opacity:0;animation:fadeIn .8s ease forwards}.main-title{font-size:28px;font-weight:800;margin-bottom:8px;background:linear-gradient(to bottom,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{font-size:15px;color:var(--text-secondary);margin-bottom:40px}.pin-indicators{display:flex;justify-content:center;gap:20px;margin-bottom:40px}.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);transition:all .2s cubic-bezier(0.4,0,0.2,1)}.pin-dot.filled{background:var(--accent-orange);border-color:var(--accent-orange);box-shadow:0 0 15px rgba(220,129,9,0.5);transform:scale(1.2)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;justify-items:center}.key{width:75px;height:75px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);color:white;font-size:26px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(10px)}.key:active{background:var(--accent-orange);border-color:var(--accent-orange);transform:scale(0.9)}.key.delete-key svg{width:28px;height:28px;fill:white}.key.placeholder{visibility:hidden}.error-message{color:var(--error-red);font-size:14px;margin-top:20px;height:20px;opacity:0;transition:opacity .3s}.logout-button{margin-top:40px;background:none;border:none;color:var(--text-secondary);font-size:14px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:4px;transition:color .3s}.logout-button:hover{color:white}@keyframes fadeIn{to{opacity:1}}</style></head><body><audio id="clickSound" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio><div class="pin-container"><h1 class="main-title">EnterPIN</h1><p class="subtitle">Secureaccesstoyourwallet</p><div class="pin-indicators" id="pinIndicators"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div><div id="error-message" class="error-message">InvalidPIN.Pleasetryagain.</div><div class="keypad" id="keypad"><button class="key" onclick="playClick()" data-value="1">1</button><button class="key" onclick="playClick()" data-value="2">2</button><button class="key" onclick="playClick()" data-value="3">3</button><button class="key" onclick="playClick()" data-value="4">4</button><button class="key" onclick="playClick()" data-value="5">5</button><button class="key" onclick="playClick()" data-value="6">6</button><button class="key" onclick="playClick()" data-value="7">7</button><button class="key" onclick="playClick()" data-value="8">8</button><button class="key" onclick="playClick()" data-value="9">9</button><div class="key placeholder"></div><button class="key" onclick="playClick()" data-value="0">0</button><button class="key delete-key" onclick="playClick()" data-action="delete"><svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg></button></div><button id="logoutButton" class="logout-button">LogOut</button></div><script type="module" src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js"></script><script type="module" src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js"></script><script type="module" src="pin.js"></script><script>function playClick(){const s=document.getElementById('clickSound').cloneNode(true);s.volume=0.5;s.play()}</script></body></html>
