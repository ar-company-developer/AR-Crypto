<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Settings|ARCrypto</title><style>:root{--bg-dark:#070b14;--accent-orange:#dc8109;--accent-red:#ff4d4d;--text-main:#ffffff;--text-secondary:#94a3b8;--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.08)}body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:radial-gradient(circle at 50% 0%,#1e293b 0%,#070b14 100%);color:var(--text-main);margin:0;padding:0;min-height:100vh;display:flex;flex-direction:column;align-items:center}.container{width:100%;max-width:420px;padding:20px;box-sizing:border-box}.header-nav{width:100%;display:flex;align-items:center;padding:20px 0}.back-btn{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:white;text-decoration:none}.profile-section{background:var(--glass);border:1px solid var(--glass-border);border-radius:24px;padding:20px;display:flex;align-items:center;gap:15px;margin-bottom:30px;backdrop-filter:blur(10px)}.profile-img{width:60px;height:60px;border-radius:50%;background:var(--accent-orange);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}.section-title{font-size:13px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px 10px}.settings-group{background:var(--glass);border:1px solid var(--glass-border);border-radius:24px;overflow:hidden;backdrop-filter:blur(10px)}.setting-item{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--glass-border);cursor:pointer;transition:0.2s}.setting-item:last-child{border-bottom:none}.setting-item:active{background:rgba(255,255,255,0.05)}.setting-label{font-size:15px;font-weight:500}.logout .setting-label{color:var(--accent-red)}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);z-index:1000;align-items:center;justify-content:center}.modal-content{background:#161d2b;border:1px solid var(--glass-border);border-radius:28px;padding:25px;width:85%;max-width:320px;text-align:center}.data-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--glass-border)}.close-btn{margin-top:20px;width:100%;padding:14px;background:var(--accent-orange);border:none;border-radius:14px;color:white;font-weight:700;cursor:pointer}</style></head><body><div class="container"><div class="header-nav"><a href="card.html" class="back-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a><span style="margin-left:15px;font-weight:700">Settings</span></div><div class="profile-section"><div class="profile-img">AR</div><div><div id="holder_name" style="font-weight:700;font-size:18px">Loading...</div><div id="email" style="color:var(--text-secondary);font-size:13px">@loading</div></div></div><div class="section-title">Account</div><div class="settings-group"><div class="setting-item" id="profile-data-setting"><span class="setting-label">My Profile Data</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div><div class="setting-item" onclick="window.location.href='https://t.me/ArBank2025_bot'"><span class="setting-label">Support Bot</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div></div><div class="section-title">Legal</div><div class="settings-group"><div class="setting-item" onclick="window.location.href='rules.html'"><span class="setting-label">Terms & Rules</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div><div id="logout-button" class="setting-item logout"><span class="setting-label">Log Out</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7"/></svg></div></div></div><div id="profileModal" class="modal"><div class="modal-content"><h3 style="margin-top:0">Account Info</h3><div class="data-row"><span style="color:var(--text-secondary)">Email</span><span id="modalEmail">...</span></div><div class="data-row"><span style="color:var(--text-secondary)">Name</span><span id="modalFullName">...</span></div><div class="data-row"><span style="color:var(--text-secondary)">User</span><span id="modalUsername">...</span></div><button class="close-btn" onclick="document.getElementById('profileModal').style.display='none'">Close</button></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyCxfUZl7STcdC53SSogfbVc-4dIijVEbLg",authDomain:"ar-bank-dbfd9.firebaseapp.com",databaseURL:"https://ar-bank-dbfd9-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ar-bank-dbfd9"};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);onAuthStateChanged(auth,(u)=>{if(u){get(ref(db,`user/${u.uid}`)).then((s)=>{if(s.exists()){const d=s.val();document.getElementById('holder_name').textContent=d.card?.holder_name||'User';document.getElementById('email').textContent=d.email||'';document.getElementById('profile-data-setting').onclick=()=>{document.getElementById('modalEmail').textContent=d.email;document.getElementById('modalFullName').textContent=d.full_name;document.getElementById('modalUsername').textContent=d.username;document.getElementById('profileModal').style.display='flex'}}})}else{window.location.href="hello.html"}});document.getElementById('logout-button').onclick=()=>signOut(auth).then(()=>window.location.href="hello.html");</script></body></html>
